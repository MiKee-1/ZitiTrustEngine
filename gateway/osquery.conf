{
  "schedule": {
    "processes": {
      "query": "SELECT pid, parent, name, path, cmdline, uid, gid, start_time FROM processes;",
      "interval": 30,
      "snapshot": true
    },
    "modbus_sockets": {
      "query": "SELECT pid, family, protocol, local_address, local_port, remote_address, remote_port, state FROM process_open_sockets WHERE local_port = 502 OR remote_port = 502;",
      "interval": 30,
      "snapshot": true
    }
  }
}
