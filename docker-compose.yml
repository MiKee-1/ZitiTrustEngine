services:
  # ---------------------------------------------------------------------
  # Ziti controller: together with the router, the only component with an
  # interface on both "ot" and "it". The Edge Client API (1280) stays
  # reachable from both networks: the gateways need it for the dial. The
  # Edge Management API (1281) is bound ONLY on the controller's IP on the
  # "it" network: from "ot" it's not even reachable at the TCP level (see
  # ziti/controller/).
  # ---------------------------------------------------------------------
  ziti-controller:
    build:
      context: ./ziti/controller
      args:
        ZITI_VERSION: ${ZITI_VERSION}
    healthcheck:
      test: curl -m 1 -s -k https://${ZITI_CTRL_EDGE_ADVERTISED_ADDRESS}:${ZITI_CTRL_EDGE_ADVERTISED_PORT}/edge/client/v1/version
      start_period: 30s
      interval: 2s
      timeout: 3s
      retries: 40
    env_file: [./.env]
    environment:
      - ZITI_CTRL_NAME=${ZITI_CTRL_NAME}
      - ZITI_CTRL_EDGE_ADVERTISED_ADDRESS=${ZITI_CTRL_EDGE_ADVERTISED_ADDRESS}
      - ZITI_CTRL_EDGE_ADVERTISED_PORT=${ZITI_CTRL_EDGE_ADVERTISED_PORT}
      - ZITI_CTRL_ADVERTISED_ADDRESS=${ZITI_CTRL_ADVERTISED_ADDRESS}
      - ZITI_CTRL_ADVERTISED_PORT=${ZITI_CTRL_ADVERTISED_PORT}
      - ZITI_EDGE_IDENTITY_ENROLLMENT_DURATION=${ZITI_EDGE_IDENTITY_ENROLLMENT_DURATION}
      - ZITI_ROUTER_ENROLLMENT_DURATION=${ZITI_ROUTER_ENROLLMENT_DURATION}
      - ZITI_USER=${ZITI_USER}
      - ZITI_PWD=${ZITI_PWD}
      # dedicated bind point for the Edge Management API: controller's "it" IP only
      - ZITI_CTRL_MGMT_BIND=${CTRL_IT_IP}:${ZITI_CTRL_MGMT_PORT}
      # adds the controller's "it" IP to the server certificate's SANs (otherwise the
      # bind point above fails TLS validation at startup)
      - ZITI_CTRL_EDGE_IP_OVERRIDE=${CTRL_IT_IP}
    ports:
      - 127.0.0.1:${ZITI_CTRL_EDGE_ADVERTISED_PORT}:${ZITI_CTRL_EDGE_ADVERTISED_PORT}
    networks:
      ot:
        ipv4_address: ${CTRL_OT_IP}
        aliases: [ziti-controller]
      it:
        ipv4_address: ${CTRL_IT_IP}
        aliases: [ziti-controller]
    volumes:
      - ziti-fs:/persistent
      - ./logs/controller:/events

  # ---------------------------------------------------------------------
  # Public edge router: the only router in this lab. Must sit on both
  # networks because it's the one carrying the Ziti data channel (3022)
  # all the way to the gateways on the ot network.
  # ---------------------------------------------------------------------
  ziti-router:
    build:
      context: ./ziti/router
      args:
        ZITI_VERSION: ${ZITI_VERSION}
    env_file: [./.env]
    depends_on:
      ziti-controller:
        condition: service_healthy
    environment:
      - ZITI_CTRL_ADVERTISED_ADDRESS=${ZITI_CTRL_ADVERTISED_ADDRESS}
      - ZITI_CTRL_ADVERTISED_PORT=${ZITI_CTRL_ADVERTISED_PORT}
      - ZITI_CTRL_EDGE_ADVERTISED_ADDRESS=${ZITI_CTRL_EDGE_ADVERTISED_ADDRESS}
      - ZITI_CTRL_EDGE_ADVERTISED_PORT=${ZITI_CTRL_EDGE_ADVERTISED_PORT}
      - ZITI_ROUTER_NAME=${ZITI_ROUTER_NAME}
      - ZITI_ROUTER_ADVERTISED_ADDRESS=${ZITI_ROUTER_ADVERTISED_ADDRESS}
      - ZITI_ROUTER_PORT=${ZITI_ROUTER_PORT}
      - ZITI_ROUTER_LISTENER_BIND_PORT=${ZITI_ROUTER_LISTENER_BIND_PORT}
      - ZITI_ROUTER_ROLES=${ZITI_ROUTER_ROLES}
    networks:
      ot:
        ipv4_address: ${ROUTER_OT_IP}
        aliases: [ziti-router]
      it:
        ipv4_address: ${ROUTER_IT_IP}
        aliases: [ziti-router]
    volumes:
      - ziti-fs:/persistent
    command: ["edge"]

  # ---------------------------------------------------------------------
  # One-shot setup: identities, the "historian" service, policies. Talks
  # ONLY to the controller's Edge Management API (1281), on the "it"
  # network.
  # ---------------------------------------------------------------------
  ziti-setup:
    image: "${ZITI_IMAGE}:${ZITI_VERSION}"
    user: root
    env_file: [./.env]
    depends_on:
      ziti-controller:
        condition: service_healthy
      ziti-router:
        condition: service_started
    environment:
      - ZITI_CTRL_MGMT_ADDR=https://${ZITI_CTRL_EDGE_ADVERTISED_ADDRESS}:${ZITI_CTRL_MGMT_PORT}
      - ZITI_USER=${ZITI_USER}
      - ZITI_PWD=${ZITI_PWD}
      - ZITI_ROUTER_NAME=${ZITI_ROUTER_NAME}
    networks:
      it:
        aliases: [ziti-setup]
    volumes:
      - ziti-identities:/identities
      - ./ziti/setup/setup.sh:/setup.sh:ro
    entrypoint: ["bash", "/setup.sh"]

  # ---------------------------------------------------------------------
  # ziti-host: server-side tunneler. Publishes (binds) the "historian"
  # service into the rest of the Ziti overlay. Sits ONLY on the "it"
  # network: it doesn't have, and doesn't need, any interface on "ot".
  # ---------------------------------------------------------------------
  ziti-host:
    image: openziti/ziti-host:latest
    depends_on:
      ziti-setup:
        condition: service_completed_successfully
    environment:
      - ZITI_IDENTITY_BASENAME=ziti-host
    volumes:
      # only its own identity (subdirectory written by ziti-setup)
      - type: volume
        source: ziti-identities
        target: /ziti-edge-tunnel
        volume:
          subpath: ziti-host
    networks:
      it:
        ipv4_address: ${ZITI_HOST_IT_IP}
        aliases: [ziti-host]

  # ---------------------------------------------------------------------
  # Historian: data store, "it" network only. No port published on the
  # host: reachable only from within the "it" network (by ziti-host) or
  # via Ziti dial (by the gateways).
  # ---------------------------------------------------------------------
  historian:
    build: ./historian
    networks:
      it:
        ipv4_address: ${HISTORIAN_IT_IP}
        aliases: [historian]
    volumes:
      - historian-data:/data

  # ---------------------------------------------------------------------
  # Gateways: "ot" network only. Each one runs ziti-edge-tunnel in-process
  # (see gateway/entrypoint.sh): the tunneler intercepts historian.ziti and
  # carries it over the overlay, so the scripts use plain HTTP. NET_ADMIN and
  # /dev/net/tun are what the tunneler needs to create its tun interface and
  # routes.
  #
  # Each gateway mounts only its own subdirectory of the identity volume, so
  # it can't read the other gateway's or ziti-host's certificate and key.
  # ---------------------------------------------------------------------
  gateway-a:
    build: ./gateway
    depends_on:
      ziti-setup:
        condition: service_completed_successfully
      historian:
        condition: service_started
      plc:
        condition: service_started
    environment:
      - GATEWAY_ID=gateway-a
      - HISTORIAN_IP=${HISTORIAN_IT_IP}
      - HISTORIAN_PORT=5000
      - PLC_IP=${PLC_OT_IP}
      - PLC_PORT=${PLC_PORT}
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    volumes:
      - type: volume
        source: ziti-identities
        target: /identities
        read_only: true
        volume:
          subpath: gateway-a
      - ./logs/osquery:/logs
    networks:
      ot:
        ipv4_address: ${GATEWAY_A_OT_IP}
        aliases: [gateway-a]

  gateway-b:
    build: ./gateway
    depends_on:
      ziti-setup:
        condition: service_completed_successfully
      historian:
        condition: service_started
      plc:
        condition: service_started
    environment:
      - GATEWAY_ID=gateway-b
      - HISTORIAN_IP=${HISTORIAN_IT_IP}
      - HISTORIAN_PORT=5000
      - PLC_IP=${PLC_OT_IP}
      - PLC_PORT=${PLC_PORT}
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    volumes:
      - type: volume
        source: ziti-identities
        target: /identities
        read_only: true
        volume:
          subpath: gateway-b
      - ./logs/osquery:/logs
    networks:
      ot:
        ipv4_address: ${GATEWAY_B_OT_IP}
        aliases: [gateway-b]

  # ---------------------------------------------------------------------
  # plc: synthetic Modbus/TCP server, "ot" network only. Stands in for the
  # physical device the gateways poll.
  # ---------------------------------------------------------------------
  plc:
    build: ./plc
    networks:
      ot:
        ipv4_address: ${PLC_OT_IP}
        aliases: [plc]

  # ---------------------------------------------------------------------
  # zeek: passive traffic analyzer, sharing the plc's network namespace
  # (not a separate network entry) so it sees the raw Modbus traffic
  # between the gateways and the plc. That traffic stays on "ot" and never
  # enters the Ziti overlay, so this is the only place it can be observed.
  # ---------------------------------------------------------------------
  zeek:
    image: zeek/zeek:latest
    network_mode: "service:plc"
    cap_add:
      - NET_RAW
      - NET_ADMIN
    # the image's default command is just "bash": it does NOT auto-start capture
    # from ZEEK_INTERFACE, so the interface/policy has to be given explicitly here.
    # "local" loads Zeek's standard base policy, which includes the Modbus analyzer.
    # "-C" = don't discard packets over bad checksums: on a Docker veth, checksums
    # are computed by NIC offload after capture, so Zeek sees them as "wrong" even
    # though real delivery is fine. Without -C it drops the packets before they
    # ever reach the Modbus analyzer (confirmed via reporter.log/weird.log).
    #
    # Each start writes into its own UTC-timestamped subdirectory of
    # logs/zeek/: run in place, Zeek truncates every log on restart, which
    # would lose data whenever the plc (whose namespace it shares) is
    # recreated.
    entrypoint: ["sh", "-c"]
    command:
      - d=/opt/zeek/logs/$$(date -u +%Y%m%dT%H%M%SZ) && mkdir -p "$$d" && cd "$$d" && exec zeek -C -i eth0 local
    volumes:
      - ./logs/zeek:/opt/zeek/logs
    depends_on:
      - plc

networks:
  ot:
    driver: bridge
    ipam:
      config:
        - subnet: ${OT_SUBNET}
  it:
    driver: bridge
    ipam:
      config:
        - subnet: ${IT_SUBNET}

volumes:
  ziti-fs:
  ziti-identities:
  historian-data:
